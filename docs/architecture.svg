<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .t { font-size: 34px; font-weight: 700; fill: #0f172a; }
      .st { font-size: 20px; fill: #475569; }
      .h { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .b { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 13px; fill: #334155; }
      .n { font-size: 14px; fill: #475569; }
      .det { fill: #eef2f7; stroke: #64748b; stroke-width: 1.5; }
      .llm { fill: #f3e8ff; stroke: #7c3aed; stroke-width: 2.5; }
      .ppl { fill: #fff4e6; stroke: #ea580c; stroke-width: 2; }
      .ext { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .ln { stroke: #475569; stroke-width: 1.8; fill: none; }
      .lp { stroke: #7c3aed; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>

  <text x="40" y="62" class="t">Diagrid Agent Factory</text>
  <text x="40" y="96" class="st">Agents do the work, people hold the gates, and plain workflow code runs everything in between.</text>

  <!-- People -->
  <rect x="40" y="150" width="260" height="210" rx="12" class="ppl"/>
  <text x="60" y="184" class="h">People</text>
  <text x="60" y="218" class="s">• open an issue, or add a label</text>
  <text x="60" y="244" class="s">   (agent:implement, agent:review)</text>
  <text x="60" y="274" class="s">• reply /approve or /reject</text>
  <text x="60" y="304" class="s">• merge the pull request</text>
  <text x="60" y="334" class="s">Only owners, members, collaborators</text>

  <!-- GitHub -->
  <rect x="40" y="410" width="260" height="290" rx="12" class="ext"/>
  <text x="60" y="444" class="h">GitHub</text>
  <text x="60" y="478" class="s">issues and labels (the control plane)</text>
  <text x="60" y="506" class="s">comments (the record of every step)</text>
  <text x="60" y="534" class="s">branches and pull requests</text>
  <text x="60" y="562" class="s">reviews (COMMENT, never APPROVE)</text>
  <text x="60" y="610" class="n">Called only from activities.</text>
  <text x="60" y="632" class="n">Agents never see the token.</text>
  <line x1="170" y1="360" x2="170" y2="408" class="ln" marker-end="url(#a)"/>

  <!-- Worker -->
  <rect x="340" y="130" width="920" height="600" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="360" y="162" class="h">Worker: three Dapr workflows, run durably by Diagrid</text>

  <!-- issue_watch -->
  <rect x="380" y="185" width="300" height="70" rx="10" class="det"/>
  <text x="396" y="214" class="b">issue_watch</text>
  <text x="396" y="238" class="s">polls GitHub, starts runs, forwards /approve</text>
  <text x="700" y="214" class="n">One long-lived instance. Every 30 s it calls continue-as-new,</text>
  <text x="700" y="236" class="n">so its history stays small however long it runs.</text>
  <line x1="340" y1="220" x2="302" y2="430" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- implement_issue -->
  <text x="380" y="300" class="b">implement_issue</text>
  <text x="520" y="300" class="n">one run per issue</text>
  <rect x="380" y="320" width="120" height="84" rx="10" class="det"/>
  <text x="392" y="350" class="b">claim</text>
  <text x="392" y="372" class="s">label, comment,</text>
  <text x="392" y="390" class="s">fresh clone</text>

  <rect x="524" y="320" width="120" height="84" rx="10" class="llm"/>
  <text x="536" y="350" class="b">implementer</text>
  <text x="536" y="372" class="s">LLM agent: edits</text>
  <text x="536" y="390" class="s">code, adds a test</text>

  <rect x="668" y="320" width="120" height="84" rx="10" class="det"/>
  <text x="680" y="350" class="b">verify</text>
  <text x="680" y="372" class="s">git diff and the</text>
  <text x="680" y="390" class="s">test run, itself</text>

  <rect x="812" y="320" width="120" height="84" rx="10" class="llm"/>
  <text x="824" y="350" class="b">reviewer</text>
  <text x="824" y="372" class="s">LLM agent: ends</text>
  <text x="824" y="390" class="s">with a VERDICT</text>

  <rect x="956" y="320" width="120" height="84" rx="10" class="ppl"/>
  <text x="968" y="350" class="b">approval gate</text>
  <text x="968" y="372" class="s">waits up to 24 h</text>
  <text x="968" y="390" class="s">for /approve</text>

  <rect x="1100" y="320" width="120" height="84" rx="10" class="det"/>
  <text x="1112" y="350" class="b">open PR</text>
  <text x="1112" y="372" class="s">commit, push,</text>
  <text x="1112" y="390" class="s">pull request</text>

  <line x1="500" y1="362" x2="522" y2="362" class="ln" marker-end="url(#a)"/>
  <line x1="644" y1="362" x2="666" y2="362" class="ln" marker-end="url(#a)"/>
  <line x1="788" y1="362" x2="810" y2="362" class="ln" marker-end="url(#a)"/>
  <line x1="932" y1="362" x2="954" y2="362" class="ln" marker-end="url(#a)"/>
  <line x1="1076" y1="362" x2="1098" y2="362" class="ln" marker-end="url(#a)"/>
  <path d="M872,404 C872,460 584,460 584,406" class="ln" marker-end="url(#a)"/>
  <text x="610" y="470" class="n">changes requested: back to the implementer, at most 2 rounds</text>
  <text x="380" y="500" class="n">No change, no approved change after 2 rounds, /reject or no answer in 24 h: the issue gets agent:needs-human.</text>

  <!-- review_pull_request -->
  <text x="380" y="560" class="b">review_pull_request</text>
  <text x="560" y="560" class="n">one run per PR head commit</text>
  <rect x="380" y="580" width="120" height="84" rx="10" class="det"/>
  <text x="392" y="610" class="b">fetch PR</text>
  <text x="392" y="632" class="s">diff, clone at</text>
  <text x="392" y="650" class="s">the head commit</text>

  <rect x="524" y="580" width="120" height="84" rx="10" class="llm"/>
  <text x="536" y="610" class="b">reviewer</text>
  <text x="536" y="632" class="s">LLM agent, the</text>
  <text x="536" y="650" class="s">same definition</text>

  <rect x="668" y="580" width="120" height="84" rx="10" class="det"/>
  <text x="680" y="610" class="b">post review</text>
  <text x="680" y="632" class="s">as a COMMENT,</text>
  <text x="680" y="650" class="s">adds a label</text>

  <line x1="500" y1="622" x2="522" y2="622" class="ln" marker-end="url(#a)"/>
  <line x1="644" y1="622" x2="666" y2="622" class="ln" marker-end="url(#a)"/>
  <text x="812" y="612" class="n">Agents get five tools: list, read, search,</text>
  <text x="812" y="634" class="n">write (inside one directory) and run tests.</text>
  <text x="812" y="656" class="n">No shell, no git, no token, no merge.</text>
  <line x1="340" y1="640" x2="302" y2="640" class="ln" marker-end="url(#a)"/>

  <!-- Diagrid -->
  <rect x="1300" y="150" width="260" height="290" rx="12" class="ext"/>
  <text x="1320" y="184" class="h">Diagrid</text>
  <text x="1320" y="218" class="s">workflow engine: state, retries,</text>
  <text x="1320" y="238" class="s">timers, external events</text>
  <text x="1320" y="270" class="s">key-value store: agent sessions</text>
  <text x="1320" y="290" class="s">and the agent registry</text>
  <text x="1320" y="322" class="s">console: every run, step and</text>
  <text x="1320" y="342" class="s">agent run</text>
  <text x="1320" y="392" class="n">A restart resumes each run from</text>
  <text x="1320" y="414" class="n">its last completed step.</text>
  <line x1="1262" y1="260" x2="1298" y2="260" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- LLM -->
  <rect x="1300" y="480" width="260" height="220" rx="12" class="llm"/>
  <text x="1320" y="514" class="h">LLM</text>
  <text x="1320" y="548" class="s">Claude Agent SDK, or any model</text>
  <text x="1320" y="568" class="s">behind a Dapr Conversation</text>
  <text x="1320" y="588" class="s">component</text>
  <text x="1320" y="636" class="n">Called only from the two agent</text>
  <text x="1320" y="658" class="n">steps, never by the workflow.</text>
  <line x1="1262" y1="590" x2="1298" y2="590" class="lp" marker-end="url(#p)"/>

  <!-- Legend -->
  <rect x="40" y="770" width="1520" height="96" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="70" y="800" width="36" height="36" rx="8" class="det"/>
  <text x="120" y="814" class="b">Deterministic</text>
  <text x="120" y="836" class="s">Plain code. The same input gives the same result.</text>
  <rect x="560" y="800" width="36" height="36" rx="8" class="llm"/>
  <text x="610" y="814" class="b">Needs an LLM</text>
  <text x="610" y="836" class="s">An agent run. Its output varies, so the workflow checks it.</text>
  <rect x="1080" y="800" width="36" height="36" rx="8" class="ppl"/>
  <text x="1130" y="814" class="b">Needs a person</text>
  <text x="1130" y="836" class="s">The workflow waits for the decision.</text>
</svg>
