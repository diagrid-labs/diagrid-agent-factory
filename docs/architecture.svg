<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" width="1600" height="820" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .t { font-size: 34px; font-weight: 700; fill: #0f172a; }
      .h { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .b { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 15px; fill: #334155; }
      .n { font-size: 15px; fill: #475569; }
      .det { fill: #eef2f7; stroke: #64748b; stroke-width: 1.5; }
      .llm { fill: #f3e8ff; stroke: #7c3aed; stroke-width: 2.5; }
      .ppl { fill: #fff4e6; stroke: #ea580c; stroke-width: 2; }
      .ext { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .ln { stroke: #475569; stroke-width: 1.8; fill: none; }
      .lp { stroke: #7c3aed; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; }
    </style>
  </defs>
  <rect width="1600" height="820" fill="#ffffff"/>

  <text x="40" y="66" class="t">Diagrid Agent Factory</text>

  <!-- People -->
  <rect x="40" y="130" width="260" height="190" rx="12" class="ppl"/>
  <text x="62" y="168" class="h">People</text>
  <text x="62" y="208" class="s">open an issue</text>
  <text x="62" y="238" class="s">reply /approve</text>
  <text x="62" y="268" class="s">merge</text>
  <line x1="170" y1="320" x2="170" y2="378" class="ln" marker-end="url(#a)"/>

  <!-- GitHub -->
  <rect x="40" y="380" width="260" height="290" rx="12" class="ext"/>
  <text x="62" y="418" class="h">GitHub</text>
  <text x="62" y="458" class="s">issues and labels</text>
  <text x="62" y="488" class="s">comments</text>
  <text x="62" y="518" class="s">pull requests and reviews</text>

  <!-- Worker -->
  <rect x="340" y="110" width="920" height="580" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="362" y="146" class="h">Dapr workflows on Diagrid</text>

  <!-- issue_watch -->
  <rect x="380" y="175" width="260" height="64" rx="10" class="det"/>
  <text x="400" y="203" class="b">issue_watch</text>
  <text x="400" y="225" class="s">polls GitHub every 30 s</text>
  <line x1="340" y1="207" x2="302" y2="420" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- implement_issue -->
  <text x="380" y="292" class="b">implement_issue</text>
  <rect x="380" y="310" width="120" height="70" rx="10" class="det"/>
  <text x="400" y="351" class="b">claim</text>
  <rect x="524" y="310" width="120" height="70" rx="10" class="llm"/>
  <text x="533" y="351" class="b">implementer</text>
  <rect x="668" y="310" width="120" height="70" rx="10" class="det"/>
  <text x="684" y="341" class="b">verify</text>
  <text x="684" y="363" class="s">diff + tests</text>
  <rect x="812" y="310" width="120" height="70" rx="10" class="llm"/>
  <text x="832" y="351" class="b">reviewer</text>
  <rect x="956" y="310" width="120" height="70" rx="10" class="ppl"/>
  <text x="972" y="351" class="b">/approve</text>
  <rect x="1100" y="310" width="120" height="70" rx="10" class="det"/>
  <text x="1116" y="351" class="b">open PR</text>

  <line x1="500" y1="345" x2="522" y2="345" class="ln" marker-end="url(#a)"/>
  <line x1="644" y1="345" x2="666" y2="345" class="ln" marker-end="url(#a)"/>
  <line x1="788" y1="345" x2="810" y2="345" class="ln" marker-end="url(#a)"/>
  <line x1="932" y1="345" x2="954" y2="345" class="ln" marker-end="url(#a)"/>
  <line x1="1076" y1="345" x2="1098" y2="345" class="ln" marker-end="url(#a)"/>
  <path d="M872,380 C872,440 584,440 584,382" class="ln" marker-end="url(#a)"/>
  <text x="640" y="452" class="n">changes requested (max 2 rounds)</text>

  <!-- review_pull_request -->
  <text x="380" y="530" class="b">review_pull_request</text>
  <rect x="380" y="548" width="120" height="70" rx="10" class="det"/>
  <text x="400" y="589" class="b">fetch PR</text>
  <rect x="524" y="548" width="120" height="70" rx="10" class="llm"/>
  <text x="544" y="589" class="b">reviewer</text>
  <rect x="668" y="548" width="120" height="70" rx="10" class="det"/>
  <text x="684" y="589" class="b">post review</text>
  <line x1="500" y1="583" x2="522" y2="583" class="ln" marker-end="url(#a)"/>
  <line x1="644" y1="583" x2="666" y2="583" class="ln" marker-end="url(#a)"/>
  <line x1="340" y1="600" x2="302" y2="600" class="ln" marker-end="url(#a)"/>

  <!-- Diagrid -->
  <rect x="1300" y="130" width="260" height="200" rx="12" class="ext"/>
  <text x="1322" y="168" class="h">Diagrid</text>
  <text x="1322" y="208" class="s">workflow state</text>
  <text x="1322" y="238" class="s">retries and timers</text>
  <text x="1322" y="268" class="s">key-value store</text>
  <text x="1322" y="298" class="s">console</text>
  <line x1="1262" y1="250" x2="1298" y2="250" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- LLM -->
  <rect x="1300" y="470" width="260" height="140" rx="12" class="llm"/>
  <text x="1322" y="508" class="h">LLM</text>
  <text x="1322" y="548" class="s">Claude Agent SDK</text>
  <text x="1322" y="576" class="s">or Dapr Conversation</text>
  <line x1="1262" y1="560" x2="1298" y2="560" class="lp" marker-end="url(#p)"/>

  <!-- Legend -->
  <rect x="380" y="730" width="34" height="34" rx="8" class="det"/>
  <text x="426" y="753" class="s">Plain code</text>
  <rect x="620" y="730" width="34" height="34" rx="8" class="llm"/>
  <text x="666" y="753" class="s">Calls an LLM</text>
  <rect x="880" y="730" width="34" height="34" rx="8" class="ppl"/>
  <text x="926" y="753" class="s">Waits for a person</text>
</svg>
