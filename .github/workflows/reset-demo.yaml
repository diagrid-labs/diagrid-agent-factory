# Actions → Reset demo → Run workflow: puts the demo back to its start. Open the
# demo's issue yourself afterwards.
name: Reset demo

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: reset-demo
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      TARGET_REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Optional. Without it the agents' running workflows on Diagrid are left alone.
      DIAGRID_API_KEY: ${{ secrets.DIAGRID_API_KEY }}
      WORK_ROOT: ${{ github.workspace }}/.work
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen

      - name: Diagrid CLI
        if: env.DIAGRID_API_KEY != ''
        run: |
          # The installer downloads the binary into the current directory.
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -sSL https://downloads.diagrid.io/cli/install.sh | bash
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          ./diagrid login --api-key "$DIAGRID_API_KEY"

      - name: Reset
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          uv run python scripts/reset_demo.py --yes --no-seed | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
