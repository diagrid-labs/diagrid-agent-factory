# Applied once by hand; Argo CD keeps the agent-factory namespace in sync with
# deploy/ on main from then on.
#   kubectl apply -f deploy/argocd/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-factory
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:diagrid-labs/diagrid-agent-factory.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: agent-factory
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
